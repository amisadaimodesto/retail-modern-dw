services:
  dw_postgres:
    image: postgres:16-alpine
    container_name: retail_dw_postgres
    restart: always
    environment:
      POSTGRES_USER: dw_admin
      POSTGRES_PASSWORD: dw_secure_password123
      POSTGRES_DB: retail_dw
    ports:
      - "5432:5432"
    volumes:
      - pgdata_retail_dw:/var/lib/postgresql/data
      - ./docker/init_dw.sql:/docker-entrypoint-initdb.d/init_dw.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_admin -d retail_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_retail_dw:
    driver: local
